name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes any run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv invocation asserts the lockfile is current instead of silently
# updating it. Note UV_FROZEN is a different setting and conflicts with --locked.
env:
  UV_LOCKED: "1"

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # The catalog freeze guard diffs against the pull request's base, which needs history
          # beyond the merge commit the default shallow checkout provides.
          fetch-depth: 0

      # Pinned to an exact patch: setup-uv publishes no floating major tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails the build if uv.lock is stale relative to pyproject.toml,
      # so a dependency edit can't land without its lockfile update.
      - name: Install dependencies
        id: install
        run: uv sync --locked --all-groups

      # Each check runs even when an earlier check failed, so one run reports
      # every problem at once. They are gated on the install rather than on
      # `!cancelled()` alone, because `uv run` would otherwise happily build its
      # own environment and report a green check on top of a broken install.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check --diff .

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      # DEC-057: released catalog versions are immutable, and the guard fails the pull request
      # that proposes an edit rather than leaving the hash check to fail at the next load. Runs
      # only on pull requests — a push to a protected branch already passed it.
      - name: catalog freeze guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: uv run python scripts/check_catalog_freeze.py --base "origin/${{ github.base_ref }}"

      # The threat model's section 8 named the gap this closes (#407): gitleaks ran only as a
      # local hook, which `--no-verify` or a clone without `pre-commit install` bypasses. This is
      # the enforcement point that cannot be skipped, pinned to the same release the pre-commit
      # hook uses, scanning the full history the fetch-depth above already provides. `--redact`
      # keeps any hit out of the CI log, which would otherwise republish what it caught.
      - name: gitleaks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

      # Integration and evaluation markers are deselected by the addopts in
      # pyproject.toml, so this needs no provider API keys.
      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
