name: scorecard

# Regenerates the evaluation scorecard from the recorded runs and fails if the committed page has
# drifted from what the current code and truth sets produce (DEC-076). The feeds are the real
# input and are regenerable; the rendered page is committed so its history is the git history, and
# this check keeps the two in agreement. Offline throughout: the recorded runs need no provider
# key, which the CI constraint requires.
#
# A committed page cannot be pushed back by CI on a protected branch, so this checks rather than
# writes; a stale page is a red check with the regeneration command in the failure. When the
# checks pass the committed pages are current, so those are what the job uploads for review — no
# re-render, and nothing to upload when a page is stale (the red check already says so).
#
# Every pull request, deliberately unfiltered (#405): the harness replays the full pipeline, so
# the regenerated feeds depend on far more than the evaluation tree — a change to workflow/,
# domain/, or any service can move a feed value. A path filter here let those changes drift the
# committed pages silently until an unrelated evaluation PR inherited the red check. The three
# checks run offline in seconds; the filter was not buying meaningful CI time.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  check:
    name: the scorecard and comparison are current
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # The scorecard and the comparison read the same feeds, so the sweep runs once here and both
      # checks render from the result rather than replaying every recording twice (#450). The
      # ablation runs a different sweep — nodes dropped in turn — and keeps its own.
      - name: Sweep the recorded runs once
        run: uv run python scripts/build_scorecard.py --sweep-to "${RUNNER_TEMP}/feeds.json"

      - name: The committed scorecard matches the recorded runs
        run: uv run python scripts/build_scorecard.py --check --from-feeds "${RUNNER_TEMP}/feeds.json"

      - name: The committed comparison matches the recorded runs
        run: uv run python scripts/build_comparison.py --check --from-feeds "${RUNNER_TEMP}/feeds.json"

      - name: The committed ablation table matches the recorded runs
        run: uv run python scripts/build_ablation.py --check

      # When the checks pass the committed pages are current by definition, so they are the fresh
      # copies — no second sweep to re-render them. On a stale page the check above is already red
      # with the regeneration command, and this step is skipped rather than uploading a stale copy.
      - name: Upload the current pages for review
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-scorecard
          path: |
            docs/eval/scorecard.html
            docs/eval/comparison.md
            docs/eval/ablation.md
          if-no-files-found: error
          retention-days: 30
