questions:
- id: qst-001
  question: Does the Event Receiver perform any authentication or source validation for incoming deployment
    events beyond accepting any well-formed delivery (for example, verifying CI signatures, validating
    source IPs, or requiring a shared secret)?
  priority: high
  blocking: true
  answer: 'The documentation answers this directly: the CI platform supports signing deliveries with a
    shared secret so a receiver can verify origin, and the receiver accepts and processes any well-formed
    delivery without checking a signature. No authentication or source validation is performed on incoming
    deployment events; that is a documented posture, not an absence of documentation.'
- id: qst-002
  question: Are deployment events or the resulting chat notifications stored or logged persistently anywhere
    (for example, in databases, log stores, or message queues), and if so, where and for how long?
  priority: medium
  blocking: false
  answer: null
- id: qst-003
  question: Is the chat platform that receives deployment notifications an externally hosted service or
    an internally hosted system, and how is the connection from the Deploy Notifier to this platform secured
    and authenticated?
  priority: medium
  blocking: false
  answer: null
- id: qst-004
