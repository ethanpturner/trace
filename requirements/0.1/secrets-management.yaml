# Category: secrets_management
# Requirements about credentials the system holds: where they live, how long
# they last, and what happens when one is exposed.

requirements:

  - id: req-SECRET-001
    catalog_version: "0.1"
    title: Long-lived signing keys and provider credentials are held in a managed secret store
    statement: >
      Credentials that authenticate the system to an external platform,
      including signing keys and provider API keys, must be held in a managed
      secret store rather than in source control, container images, or
      configuration files, and the documentation must state where they are held.
    rationale: >
      A signing key or provider credential is usually the highest-value secret
      a system holds, because it authenticates the system to every customer
      resource it can reach. Its custody is therefore a distinct architectural
      fact worth recording, separate from the general statement that a secret
      store exists.
    category:
      - secrets_management
    applicable_conditions:
      - the system holds a credential that authenticates it to an external platform
      - the system holds a private signing key
    non_applicable_conditions:
      - the system holds no credentials of its own
      - all outbound authentication uses short-lived workload identity with no stored credential
    acceptable_implementations:
      - a managed cloud secrets service
      - a dedicated secret management platform
      - workload identity that removes the need for a stored credential
      - a hardware or cloud key management service holding the private key
    evidence_expectations:
      - architecture documentation naming the secret store
      - a list of the secrets held
      - deployment or configuration documentation
    common_false_positives:
      - absent description of the secret store's own encryption, which is inherited from the platform
      - absent description of access-control policy where the managed store is named
    default_severity: high
    source_frameworks:
      - "OWASP ASVS 5.0.0: 11.1.1"
      - "NIST SP 800-53 5.2.0: IA-5"
      - "NIST SP 800-53 5.2.0: SC-12"
    status: active

  - id: req-SECRET-002
    catalog_version: "0.1"
    title: Credentials used to reach customer resources are short-lived
    statement: >
      Where a system obtains access to a customer resource, that access should
      use a short-lived credential derived at the time of use rather than a
      long-lived token stored by the system, and the documentation must state
      which is used.
    rationale: >
      A long-lived access token stored by the system remains usable for as long
      as it exists, so its exposure is unbounded in time. A short-lived
      credential derived per use bounds that window without requiring any
      revocation step. The distinction is invisible unless documentation states
      which is in use.
    category:
      - secrets_management
      - third_party_integration
    applicable_conditions:
      - the system accesses customer resources held on an external platform
      - the external platform offers short-lived or installation-scoped credentials
    non_applicable_conditions:
      - the external platform offers only long-lived credentials and this is documented
      - the system accesses no customer resources on external platforms
    acceptable_implementations:
      - installation-scoped tokens minted per operation and allowed to expire
      - short-lived tokens exchanged from a signed assertion
      - workload identity federation with no stored token
    evidence_expectations:
      - integration documentation describing token lifetime
      - description of how tokens are obtained
    common_false_positives:
      - absent stated expiry period where the platform sets it and the mechanism is named
      - absent token revocation procedure where tokens are short-lived by construction
    default_severity: medium
    source_frameworks:
      - "OWASP ASVS 5.0.0: 13.1.4"
      - "NIST SP 800-53 5.2.0: IA-5"
    status: active
