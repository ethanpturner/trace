- id: obs-001
  summary: The two documents give incompatible accounts of who can write the production model blob. The
    security notes state the production model blob is writable only from the experimental deployment path
    and the Bastion (evd-002), while the system overview states the Jupyter Notebook environment writes
    the serialized model to the model storage blob (evd-010) and the store table lists a single Machine
    Learning Model blob located in production (evd-011). Either the notebook write is intended to count
    as the 'experimental deployment path', or there is an additional writer, or more than one model blob
    exists. Which reading is authoritative changes which components can alter the model that is served
    to users, and is left for the reviewer.
