  evidence_locator: src/trace_ai/domain/base.py:81; src/trace_ai/domain/source_document.py:145; src/trace_ai/domain/evidence.py:115
  classification: c
  reasoning: 'verified: frozen=True with dict[str, Any] metadata fields; in-place mutation skips validation. Reachable
    by application code only; the docstring''s immutability claim is broader than the type enforces. Issue #677.'
