trust_boundaries:
- id: tb-001
  decision: approve
  attach_evidence: []
  editable:
    name: Public internet boundary
    boundary_type: network
    description: Separates public users and external providers from ForgeFlow's application services.
      Crossed by browser traffic and GitHub webhook events; the managed CDN/WAF terminates public TLS,
      applies managed filtering and provides basic denial-of-service protection.
    controls:
    - managed CDN and web application firewall
    - public TLS termination
    - managed filtering rules
    - basic denial-of-service protection
    - restriction to known application origins
- id: tb-002
  decision: approve
  attach_evidence: []
  editable:
    name: Customer authentication boundary
    boundary_type: authentication
    description: Separates unauthenticated users from authenticated ForgeFlow sessions. Authentication
      is delegated to GitHub OAuth; a session is established after successful GitHub authentication.
    controls:
    - GitHub OAuth delegated authentication
    - secure browser sessions
    - no local password database
- id: tb-003
  decision: approve
  attach_evidence: []
  editable:
    name: Organization (tenant) boundary
    boundary_type: tenant
    description: Separates one customer organization's data from another's. Documented as applying across
      API authorization, database queries, object paths, background jobs and analysis results; enforcement
      relies on application services applying organization-aware access rules.
    controls:
    - organization identifier on customer records
    - organization-aware access rules in application services
    - organization-scoped object storage paths
    - jobs executed within organization context
    - membership and role based access
- id: tb-004
  decision: approve
  attach_evidence: []
  editable:
    name: GitHub boundary
    boundary_type: external_service
    description: Separates ForgeFlow from GitHub-controlled identity, repository and webhook systems.
      Access uses a GitHub App with installation-scoped permissions and short-lived installation tokens;
      webhook events are validated before processing.
    controls:
    - GitHub App instead of personal access tokens
    - short-lived installation tokens
    - installation-scoped repository permissions
    - webhook event validation
- id: tb-005
  decision: approve
  attach_evidence: []
  editable:
    name: AI-provider boundary
    boundary_type: external_service
    description: Separates ForgeFlow-controlled systems from the external AI provider. Customer source
      content may cross this boundary; credentials, session cookies and direct repository access are documented
      as not crossing it.
    controls:
    - only content required for the requested analysis is transmitted
    - no GitHub credentials, session cookies or database credentials transmitted
    - enterprise provider API with contractual non-training commitment
    - structural validation of provider responses
- id: tb-006
  decision: approve
  attach_evidence: []
  editable:
    name: Administrative privilege boundary
    boundary_type: privilege
    description: Separates customer functionality from internal operational administration. The administrative
      interface is not exposed through the normal customer login flow; administrators authenticate through
      the corporate identity platform and actions are recorded for audit.
    controls:
    - corporate identity platform authentication
    - separation from customer login flow
    - administrative action audit logging
    - administrative session inactivity expiry
- id: tb-007
  decision: approve
  attach_evidence: []
  editable:
    name: Secret-access boundary
    boundary_type: credential
    description: Separates application workloads from stored credential material. Workloads retrieve secrets
      through workload identity where supported, and different services may receive access to different
      secrets based on their responsibilities.
    controls:
    - managed secrets service
    - workload identity retrieval
    - per-service secret access differentiation
    - secrets not stored in repositories or configuration files
- id: tb-008
  decision: approve
  attach_evidence: []
  editable:
    name: Repository-content instruction boundary
    boundary_type: content_trust
    description: Separates trusted ForgeFlow analysis instructions from untrusted repository and pull-request
      content. The architecture document names this boundary and states that repository content may be
      untrusted; the documents reviewed do not describe the controls that enforce it.
    controls: []
