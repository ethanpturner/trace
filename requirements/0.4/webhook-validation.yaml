# Category: webhook_validation
# Requirements about inbound events that a system accepts from an external
# platform and treats as a trigger for privileged work.
#
# Note on provenance: OWASP ASVS 5.0.0 addresses replay only for authentication
# tokens. It carries no general inbound-event replay requirement, so
# req-WEBHOOK-002 is an original requirement and cites NIST only. See
# requirements/README.md.

requirements:

  - id: req-WEBHOOK-001
    catalog_version: "0.4"
    title: Inbound event authenticity is verified before processing
    statement: >
      A system that performs privileged work in response to an inbound event
      from an external platform must verify that the event genuinely originated
      from that platform before acting on it, and the documentation must state
      that the verification is cryptographic rather than structural.
    rationale: >
      An endpoint that accepts events from a named platform is reachable by
      anyone who learns its address. Without origin verification, an attacker
      can cause the system to perform work on data of their choosing. The
      distinction that matters is between verifying a request is well formed
      and verifying it is authentic; documentation routinely says "validated"
      without saying which.
    category:
      - webhook_validation
      - authentication
      - integrity
    applicable_conditions:
      - the system exposes an endpoint that accepts events from an external platform
      - an inbound event triggers processing or state change
    non_applicable_conditions:
      - the endpoint is reachable only from within a trusted network segment and this is documented
      - inbound events are polled by the system rather than delivered to it
    acceptable_implementations:
      - HMAC signature verification using a shared secret
      - asymmetric signature verification using a platform public key
      - mutually authenticated transport with sender authorization
    evidence_expectations:
      - documentation stating that signature verification is performed
      - webhook or event receiver configuration
      - a source-code reference to the verification step
    common_false_positives:
      - documentation stating only that requests are validated, where the mechanism is unstated
      - absent description of secret storage where verification itself is documented
    default_severity: high
    source_frameworks:
      - "NIST SP 800-53 5.2.0: SI-10"
      - "NIST SP 800-53 5.2.0: SC-8"
    status: active

  - id: req-WEBHOOK-002
    catalog_version: "0.4"
    title: Replay of inbound events is prevented or made harmless
    statement: >
      A system that performs privileged or costly work in response to an
      inbound event must ensure that re-submission of a previously valid event
      does not cause that work to be repeated, or must document why repetition
      is harmless.
    rationale: >
      Origin verification establishes that an event was genuine when it was
      issued; it does not establish that it is being delivered for the first
      time. A captured, still-valid event can therefore be replayed. Where
      processing is expensive, externally visible, or state-changing, the
      effects accumulate.
    category:
      - webhook_validation
      - integrity
      - availability
    applicable_conditions:
      - inbound event processing is costly, externally visible, or state-changing
      - event authenticity is verified but delivery uniqueness is not established
    non_applicable_conditions:
      - repeated processing of the same event is idempotent and documented as such
      - the endpoint accepts no state-changing events
    acceptable_implementations:
      - persisting the platform delivery identifier and rejecting repeats
      - rejecting events whose signed timestamp falls outside a bounded window
      - idempotency keyed on the event identifier so repeats are absorbed
    evidence_expectations:
      - documentation describing duplicate or replay handling
      - description of event identifier persistence
      - description of idempotency in downstream processing
    common_false_positives:
      - absent replay handling where signature verification is documented and processing is idempotent
      - absent rate limiting, which addresses volume rather than replay
    default_severity: medium
    source_frameworks:
      - "NIST SP 800-53 5.2.0: SC-23"
      - "NIST SP 800-53 5.2.0: SI-10"
    status: active

  - id: req-WEBHOOK-003
    catalog_version: "0.4"
    title: The delivery endpoint's reachable audience is deliberately bounded
    statement: >
      Where an external platform publishes stable source addresses or offers a
      restricted delivery channel for its events, the documentation must state
      whether the inbound event endpoint applies that restriction, and where no
      restriction is applied, what makes the open endpoint acceptable.
    rationale: >
      Origin verification authenticates an event; it does not shrink the
      population that can reach the endpoint carrying it. An endpoint open to
      the whole internet receives forged, malformed, and probing traffic that a
      source restriction would have dropped before any verification ran.
      Reachability is defence in depth behind the signature, not a substitute
      for it, and the interesting documentation failure is silence about
      whether the platform's published means of restriction was considered.
    category:
      - webhook_validation
      - network_segmentation
    applicable_conditions:
      - the system exposes an endpoint that accepts events from an external platform
      - the platform publishes stable source address ranges, or offers a private or relayed delivery channel
    non_applicable_conditions:
      - the platform documents no stable source addresses and no restricted delivery channel
      - the endpoint is reachable only from within a trusted network segment and this is documented
      - inbound events are polled by the system rather than delivered to it
    acceptable_implementations:
      - source address allowlisting from the platform's published ranges, refreshed as the platform revises them
      - a private delivery channel or relay the platform operates
      - an ingress rule restricting the delivery path to the platform's infrastructure
    evidence_expectations:
      - documentation of ingress or firewall rules for the event endpoint
      - a stated decision that the endpoint is open, with the reason
      - configuration referencing the platform's published address ranges
    common_false_positives:
      - absent source restriction where signature verification is documented — the signature, not reachability, is the authenticity control
      - absent source restriction where the platform publishes no stable addresses to restrict to
    default_severity: low
    source_frameworks:
      - "NIST SP 800-53 5.2.0: SC-7"
      - "NIST SP 800-53 5.2.0: AC-4"
    status: active

  - id: req-WEBHOOK-004
    catalog_version: "0.4"
    title: Delivery verification secrets have a stated lifecycle
    statement: >
      Where inbound event authenticity rests on a shared secret or key, the
      documentation must describe where that secret is held and how it is
      rotated, including how rotation happens without dropping legitimate
      deliveries.
    rationale: >
      A signature attests only that its sender holds the secret. A delivery
      secret that is long-lived, shared across environments, or held beside the
      code that uses it degrades the authenticity claim the signature makes,
      and the degradation is invisible at the endpoint: verification continues
      to succeed. Platforms that sign deliveries support rotation, usually with
      an overlap window in which two secrets validate, precisely so rotation is
      routine rather than an outage.
    category:
      - webhook_validation
      - secrets_management
    applicable_conditions:
      - inbound event authenticity is established with a shared secret or a key the system holds
      - the same delivery secret is used across environments, or its issue date is unknown
    non_applicable_conditions:
      - no secret-based verification is performed, so there is nothing to rotate
      - the platform signs with keys it rotates unilaterally and the system fetches current public keys from a documented platform endpoint
    acceptable_implementations:
      - the delivery secret held in a managed secret store and rotated on a stated schedule
      - dual-secret rotation, with an overlap window in which either secret validates
      - per-environment delivery secrets so one disclosure does not span environments
    evidence_expectations:
      - documentation of where the delivery secret is stored
      - a rotation procedure or schedule
      - configuration referencing a secret store rather than an inline value
    common_false_positives:
      - absent rotation cadence where storage in a managed secret store is documented — storage and rotation are distinct claims, and silence about cadence is not evidence of a static secret
      - absent secret handling where verification is delegated to a platform-managed ingress product that holds the secret
    default_severity: medium
    source_frameworks:
      - "NIST SP 800-53 5.2.0: IA-5"
      - "NIST SP 800-53 5.2.0: SC-12"
    status: active
