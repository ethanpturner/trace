questions:
- id: qst-001
  question: Are submitted invoice files stored persistently after processing, and if so, in which system(s)
    and for how long?
  priority: high
  blocking: true
  answer: Not documented. Whether submitted invoice files persist after processing, and in which system,
    is undetermined; treat persistence and retention as a documentation gap, not as evidence in either
    direction.
- id: qst-002
  question: Is there any authentication or access control in front of the invoice submission workflow
    beyond the submitter field inside the uploaded document?
  priority: high
  blocking: true
  answer: The document states the submitter field is a value in the uploaded invoice document and submitters
    are not otherwise authenticated to the workflow. Whether any upstream system authenticates submitters
    before submission is not documented and remains undetermined; analysis should treat submitter identity
    at this workflow's boundary as unverified.
- id: qst-003
  question: What observability service is used to capture request and tool-call traces, and what are its
    data retention and access control policies for HTTP request and response bodies?
  priority: high
  blocking: true
  answer: Not documented. The observability service's identity, retention, and access controls are undetermined.
    The documented fact is only that captured traces include full HTTP request and response bodies.
- id: qst-004
  question: In what environment and deployment model does the Invoice Agent run (for example, production
    vs. test, and which cloud or on-premises platform)?
