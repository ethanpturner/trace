questions:
- id: qst-001
  question: Does the retrieval layer scope searches by workspace so that a workspace's queries cannot retrieve chunks
    originating from other workspaces, or does it currently operate as a process-global top-k search as described
    in the Mantis candidate record B.2?
  priority: high
  blocking: true
  answer: Not described in the supplied documentation; the reviewer has no view beyond what the documents state.
    Where the reviewer packet is the only source for the premise, its record is marked unverified by its own authors.
- id: qst-003
  question: Is the analytics collector at analytics.relay-answers.example enabled in production for Relay Answers
    traffic, and what data-handling and retention terms apply to the ticket-derived text and answers sent there?
  priority: high
  blocking: true
  answer: 'Not described in any supplied architecture or operations document, which name one external processor:
    the model provider. The only source for an analytics collector is the reviewer packet''s candidate record, which
    its own authors mark unverified; the reviewer cannot confirm or deny that such a flow exists from the documents
    supplied.'
- id: qst-002
  question: What retention and reconciliation mechanism governs ticket-derived embeddings in the retrieval index,
    particularly in cases of partial or interrupted exports and deleted or corrected tickets?
  priority: medium
  blocking: false
