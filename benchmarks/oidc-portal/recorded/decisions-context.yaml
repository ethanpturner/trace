questions:
- id: qst-001
  question: What authorization model governs which support tickets an authenticated employee can view
    and comment on (for example, role-based access, team-based scoping, or unrestricted access to all
    tickets)?
  priority: high
  blocking: true
  answer: 'The documentation covers authentication thoroughly — OpenID Connect against the enterprise
    identity provider, no local accounts, factor policy at the provider — and states nothing about per-ticket
    authorization: whether every authenticated employee can view every ticket is not documented. The authorization
    model is undetermined, and that gap is analysis input rather than a resolved fact.'
- id: qst-002
  question: Where are the portal web application and ticket service hosted relative to the corporate network
    and VPN (for example, on-premises, in a cloud VPC peered to the corporate network, or another arrangement)?
  priority: medium
  blocking: false
