# ForgeFlow evaluation contract
#
# Grading policy for the ForgeFlow benchmark scenario. Layout is fixed by DEC-027 and
# specified in docs/architecture/evaluation-plan.md section 5.
#
# This file declares no expected-output counts. DEC-028 removed them: the expected set is
# the enumerated content of the expected-*.yaml files in this directory, and a count is
# derived from a file when a report needs one. A declared count that can disagree with its
# own enumeration is a second source of truth, and a count used as a target is a finding
# quota -- which design-principles.md section 9 and evaluation-plan.md section 20 both
# reject, and which is why issue #18 moved this content out of the input directory.
#
# The counts that previously lived here were also wrong. DEC-029 finds three findings
# rather than four and four documentation gaps rather than three, because FND-001 is a
# documentation gap and FND-004 is a separate finding from FND-002.
#
# Nothing in this directory is supplied to Trace during an assessment.

benchmark_version: "1.0"

# The requirements catalog version these expected outputs were authored against. There is
# no per-scenario requirements file: the whole catalog reaches the mapping step on every
# call (DEC-024), so a scenario-scoped list could only narrow what the pipeline sees.
# Expected control mappings reference catalog identifiers directly.
catalog_version: "0.1"

matching:
  # Expected-to-actual matching is semantic, not numeric. Findings match on requirement and
  # affected component rather than on identity, because generated identifiers are scoped to
  # a run and carry no meaning across runs (DEC-018).
  findings_match_on: [requirement_id, affected_component]

  # FND-002 and FND-004 are enumerated separately, and a single well-reasoned finding that
  # combines them is defensible rather than wrong (DEC-029). The matcher has to express
  # that; how it scores a partial consolidation is an open question on that entry.
  allow_consolidation: true

  # A finding entry may carry `requires_resolution: <question key>` (DEC-133): its evidence
  # is one side of a recorded contradiction, and the entry is graded only in a run whose
  # reviewer resolved a contradiction. In any other run the entry reports as
  # conditional-unreached rather than missed, its paired question carries the grade, and a
  # baseline -- which has no reviewer -- never reaches it: a baseline finding naming the
  # pair chose a side silently, which scenario section 16 names as the failure, and it
  # scores spurious.
  conditional_findings: requires_resolution
