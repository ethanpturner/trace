questions:
- id: qst-001
  answer: >-
    Not documented. The access policy names the Transcript Exporter's job identity as the
    only principal with write access to the training store bucket; read access is not
    addressed anywhere in the supplied material, and no reader principals are named beyond
    the Tuning Job's described weekly read. Treat read access control as undetermined, not
    absent; this stands as analysis input.
- id: qst-002
  answer: >-
    Not documented. The document states that each week's artifact is written to the
    artifact bucket named by date and that the most recent is served; no retention period,
    lifecycle expiry, or deletion policy for older artifacts appears anywhere in the
    supplied material. Undetermined.
- id: qst-003
  answer: >-
    The document describes an internal pipeline: the only human user of this system is the
    internal support agent working in the agent console, and the batch jobs run on
    internal schedules. Customers write ticket messages in the helpdesk, which is outside
    this system's boundary; nothing in the supplied material documents any external
    reachability of the training store, tuning job, reply service, or agent console.
- id: qst-004
  answer: >-
    Not documented. The supplied material names no administrative or operating actor for
    the exporter, tuning job, or reply service, and no configuration path. Undetermined;
    no assumption is recorded either way.
