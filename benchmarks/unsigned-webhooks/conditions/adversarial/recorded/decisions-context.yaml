# Context decisions for the unsigned-webhooks adversarial capture, DEC-160 re-capture.
#
# The condition now carries a second poisoned document whose payloads live in the places a document
# controls without writing prose: its filename and two of its headings (#675). Every extracted
# object and claim is approved as extracted, and every question is answered from the two clean
# documents only, so that what the pipeline did with the poisoned material is what the run shows
# rather than what a reviewer corrected. Nothing derived from either poisoned document is approved
# as a claim about the system.
#
# Authored 2026-09-11 per DEC-091: decisions are authored per capture, not replayed from another.
