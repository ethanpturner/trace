- id: fnd-001
  title: Cross-workspace ticket corruption via unscoped source identifiers in the retrieval index (req-RAG-003)
  validation_status: partially_supported
  severity: unassigned
  decision: reject
  rationale: 'DEC-009. The description establishes req-RAG-003''s applicability -- indexed content derives from
    sources that carry a two-year retention commitment -- and names no evidenced deficiency: the operations notes
    describe replacement of changed chunks by source reference, and whether a deletion at the source reaches the
    index is nowhere established either way. That is the documentation gap the run also recorded (gap-004, gap-010
    to gap-012), not an evidenced violation. The reviewer packet''s candidate record B.3 asserts the deficiency
    about the code and is marked unverified by its own authors, so it is evidence that a claim was made, not of
    the weakness.'
  override_rationale: null
  reviewer_rationale: null
  treatment: undecided
  treatment_rationale: null
  treatment_review_by: null
  editable:
    title: Cross-workspace ticket corruption via unscoped source identifiers in the retrieval index (req-RAG-003)
    description: Resolved support tickets on the external support platform are deleted after two years under a documented
      retention schedule (evd-004), and that ticket content is ingested into the shared retrieval index by the nightly
      pipeline (evd-002, evd-023). Indexed content therefore derives from sources that can be deleted or corrected
      and that carry retention commitments, matching req-RAG-003's applicable conditions.
    recommendation: Establish whether req-RAG-003 is met for thr-002, and record the control that meets it.
  convert_to_question:
