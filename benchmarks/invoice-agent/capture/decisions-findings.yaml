assessment_id: asm-001
findings:
- id: fnd-001
  decision: approve
  severity: low
  editable:
    title: Invoice content sent to hosted model provider without documented scope justification
      (req-AI-003)
  rationale: 'Evidence-supported on the document''s own text, not on silence: the flow of
    parsed invoice details (amount, submitter, category, due date) to the hosted model
    provider is positively documented [evd-001, evd-004, evd-005], and req-AI-003 requires
    documenting both what crosses the model-provider boundary and why that scope is
    necessary. The documentation enumerates what is sent and carries no scope rationale
    anywhere, so the requirement is partially satisfied by the document''s own affirmative
    content — the same shape as an unenforced documented control, not a DEC-009 silence
    inference. Low severity: the deficiency is a data-minimization documentation shortfall
    on an intended, documented flow; no evidence shows a weakness in the channel itself.
    Title edited (DEC-023): the exported "interception or compromise" framing asserts a
    transport weakness no evidence establishes, and an approved finding''s title must claim
    only what its evidence supports.'
