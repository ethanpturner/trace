questions:
- id: qst-001
  question: What do the translation provider's standard terms allow in terms of retention duration and
    secondary use (e.g., training, analytics, sharing) of submitted ticket content and translations?
  priority: high
  blocking: true
  answer: 'Cannot be determined from the documentation, and that indeterminacy is itself the documented
    fact: section 3 states no agreement covering retention or secondary use has been established, the
    provider''s standard terms apply, and those terms have not been reviewed for this integration. What
    the terms permit is treated as unknown for analysis; no particular retention or use is asserted.'
- id: qst-002
  question: Can the helpdesk workspace API token used by the connector be scoped more narrowly than full
    workspace access (for example, to only read tickets and write internal notes), and if so why was a
    fully scoped token chosen?
  priority: medium
  blocking: false
  answer: The documentation states the token was scoped to full workspace access during setup because
    it was convenient, while the integration only reads tickets and writes notes (section 2). Whether
    the helpdesk supports narrower scoping is not documented; the stated reason for the current scope
    is convenience, not a technical constraint.
- id: qst-003
  question: Where is the Helpdesk Translate connector service hosted (e.g., cloud provider, network zone)
    and who operates it relative to the helpdesk and the translation SaaS provider?
  priority: medium
  blocking: false
  answer: null
- id: qst-004
  question: No actor in the context is anonymous or external. If the system is reachable from outside,
