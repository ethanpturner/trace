  decision: approve
  attach_evidence: []
  editable:
    name: Public internet to experimental boundary
    boundary_type: network
    description: Boundary between the public internet (external image services, third-party tools) and
      the experimental VPC. Access across it is documented as password-authenticated, with RBAC and ACLs
      applied. The Jupyter environment is documented as not exposed outside the experimental VPC.
