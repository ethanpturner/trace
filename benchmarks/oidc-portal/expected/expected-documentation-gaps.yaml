# OIDC Portal expected documentation gaps
#
# One gap: whether the internal network boundary the portal relies on is actually enforced
# is not established by the documents. Nothing in this directory is supplied to Trace.

benchmark_version: "1.0"
scenario: oidc-portal
catalog_version: "0.3"
source: system-overview.md

documentation_gaps:
  - key: GAP-OP-01
    requirement_id: req-NET-001
    subject: enforcement of the internal-only reachability of the ticket service is not described
    arises_from: system-overview.md section 1
    missing:
      - How the ticket service is restricted to the application subnet
      - Whether the restriction is enforced by network policy or assumed by topology
    supported_by:
      - system-overview.md
    paired_question: Q-OP-01
    notes: >
      The document states the ticket service is reachable only from the portal; how that is
      enforced is not established, and concluding it is unenforced would be the DEC-009 failure.
