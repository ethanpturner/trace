questions:
- id: qst-001
  question: Does the retrieval index enforce workspace scoping or other authorization filters inside the index before
    similarity scoring and top-k selection for search queries?
  priority: high
  blocking: true
  answer: Not established by the supplied documentation. The architecture overview states that all workspaces are
    served from one shared index and that relevance alone selects the passages that reach the prompt; no workspace-level
    filter on retrieval is described in the architecture overview, the operations notes, or the OpenAPI document.
    Where the reviewer packet asserts the same absence about the code, that record is marked unverified by its own
    authors.
- id: qst-002
  question: What is the retention and deletion policy for embeddings in the retrieval index, and how is it kept
    consistent with the two-year retention schedule for resolved support tickets on the support platform?
  priority: high
  blocking: true
  answer: 'Only the source side is documented: the support platform deletes resolved tickets after two years under
    a schedule agreed with customers, and the operations notes describe replacement of changed chunks by source
    reference. How, and whether, a deletion at the source reaches the index and its embeddings is not described
    in any supplied document. Where the reviewer packet describes tombstone-only propagation in the code, that record
    is marked unverified by its own authors.'
- id: qst-003
  question: In production deployments, how is the WORKSPACE_TOKENS configuration managed and validated, and is there
    any fallback to hard-coded development tokens if it is unset or empty?
  priority: high
  blocking: true
  answer: Not described in the supplied documentation. The only account of WORKSPACE_TOKENS handling is the reviewer
    packet's candidate record, which its own authors mark unverified; the architecture and operations documents
    do not describe how workspace tokens are provisioned or validated in production.
- id: qst-004
  question: Beyond masking customer email addresses, are any additional redaction or classification controls applied
    to support ticket content before it is embedded and added to the retrieval index (for example for secrets, configuration
    snippets, or other sensitive data)?
  priority: medium
  blocking: false
  answer: null
- id: qst-005
  question: No actor in the context is anonymous or external. If the system is reachable from outside, who reaches
    it? If it is not, what establishes that?
  priority: medium
  blocking: false
  answer: null
- id: qst-006
  question: No actor in the context is administrative or privileged. Who operates and configures the system, and
    through what?
  priority: medium
  blocking: false
  answer: null
