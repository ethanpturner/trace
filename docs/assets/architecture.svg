<svg xmlns="http://www.w3.org/2000/svg" width="990" height="612" viewBox="0 0 990 612" font-family="-apple-system,system-ui,sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a9099"/></marker></defs>
<rect width="990" height="612" fill="#ffffff"/>
<text x="40" y="40" font-size="19" font-weight="700" fill="#1f2328">Trace — the fixed fourteen-phase pipeline</text>
<text x="40" y="62" font-size="12" fill="#57606a">Model-assisted steps alternate with deterministic validation; the two human checkpoints are workflow-graph nodes, not options. Agents never write authoritative state.</text>
<rect x="40" y="96" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="54" y="116" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1. assessment_initialization</text>
<text x="54" y="133" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<line x1="190.0" y1="142" x2="190.0" y2="156" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="158" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="54" y="178" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2. document_ingestion</text>
<text x="54" y="195" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<line x1="190.0" y1="204" x2="190.0" y2="218" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="220" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="54" y="240" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">3. context_extraction</text>
<text x="54" y="257" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<line x1="190.0" y1="266" x2="190.0" y2="280" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="282" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="54" y="302" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">4. context_validation</text>
<text x="54" y="319" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<line x1="190.0" y1="328" x2="190.0" y2="342" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="344" width="300" height="46" rx="8" fill="#fdf1d6" stroke="#b58a2a" stroke-width="1.5"/>
<text x="54" y="364" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">5. human_context_review</text>
<text x="54" y="381" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">human checkpoint</text>
<line x1="190.0" y1="390" x2="190.0" y2="404" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="406" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="54" y="426" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">6. threat_generation</text>
<text x="54" y="443" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<line x1="190.0" y1="452" x2="190.0" y2="466" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="468" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="54" y="488" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">7. requirement_and_control_mapping</text>
<text x="54" y="505" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<rect x="400" y="96" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="414" y="116" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">8. evidence_validation</text>
<text x="414" y="133" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<line x1="550.0" y1="142" x2="550.0" y2="156" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="158" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="414" y="178" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">9. critical_review</text>
<text x="414" y="195" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<line x1="550.0" y1="204" x2="550.0" y2="218" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="220" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="414" y="240" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">10. finding_consolidation</text>
<text x="414" y="257" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<line x1="550.0" y1="266" x2="550.0" y2="280" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="282" width="300" height="46" rx="8" fill="#fdf1d6" stroke="#b58a2a" stroke-width="1.5"/>
<text x="414" y="302" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">11. human_finding_review</text>
<text x="414" y="319" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">human checkpoint</text>
<line x1="550.0" y1="328" x2="550.0" y2="342" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="344" width="300" height="46" rx="8" fill="#e8eef9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="414" y="364" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12. report_generation</text>
<text x="414" y="381" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">model-assisted + validation node</text>
<line x1="550.0" y1="390" x2="550.0" y2="404" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="406" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="414" y="426" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">13. evaluation</text>
<text x="414" y="443" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<line x1="550.0" y1="452" x2="550.0" y2="466" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="400" y="468" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#8a9099" stroke-width="1.5"/>
<text x="414" y="488" font-size="13" font-weight="600" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">14. assessment_completion</text>
<text x="414" y="505" font-size="10.5" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">deterministic</text>
<path d="M 340 491.0 C 380 491.0, 340 119.0, 396 119.0" fill="none" stroke="#8a9099" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="740" y="136" width="220" height="118" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="754" y="160" font-size="13" font-weight="600" fill="#1f2328" font-family="-apple-system,system-ui,sans-serif">Model seam (DEC-014)</text>
<text x="754" y="180" font-size="11" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">StructuredModel protocol</text>
<text x="754" y="198" font-size="11" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">→ Anthropic adapter (claude-opus-5)</text>
<text x="754" y="216" font-size="11" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">→ deterministic fake (recorded replay)</text>
<text x="754" y="234" font-size="11" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">one attempt per call; retries are the</text>
<text x="754" y="248" font-size="11" fill="#57606a" font-family="-apple-system,system-ui,sans-serif">orchestrator's (DEC-016)</text>
<g>
<ellipse cx="850" cy="306" rx="110" ry="16" fill="#eef4ee" stroke="#3a7d44" stroke-width="1.5"/>
<rect x="740" y="306" width="220" height="96" fill="#eef4ee" stroke="none"/>
<line x1="740" y1="306" x2="740" y2="402" stroke="#3a7d44" stroke-width="1.5"/>
<line x1="960" y1="306" x2="960" y2="402" stroke="#3a7d44" stroke-width="1.5"/>
<ellipse cx="850" cy="402" rx="110" ry="16" fill="#eef4ee" stroke="#3a7d44" stroke-width="1.5"/>
<text x="850" y="348" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif">Authoritative state</text>
<text x="850" y="366" font-size="11" fill="#57606a" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif">schema-validated domain objects</text>
<text x="850" y="382" font-size="11" fill="#57606a" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif">SQLite + hashed artifacts</text>
</g>
<line x1="700" y1="195" x2="736" y2="195" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="710" y="187" font-size="11" fill="#4a6fa5" font-family="-apple-system,system-ui,sans-serif">agents propose (local keys, no identifiers)</text>
<line x1="700" y1="354" x2="736" y2="354" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="710" y="346" font-size="11" fill="#3a7d44" font-family="-apple-system,system-ui,sans-serif">validation nodes persist (allocated identifiers)</text>
<g font-size="11" fill="#57606a">
<rect x="40" y="538" width="14" height="14" rx="3" fill="#e8eef9" stroke="#4a6fa5"/><text x="60" y="549">model-assisted (six agents, capped — DEC-030), each behind a deterministic validation node</text>
<rect x="40" y="560" width="14" height="14" rx="3" fill="#fdf1d6" stroke="#b58a2a"/><text x="60" y="571">human checkpoint — pausing is stopping (DEC-017); skipping is unrepresentable (DEC-005)</text>
<rect x="40" y="582" width="14" height="14" rx="3" fill="#f2f3f5" stroke="#8a9099"/><text x="60" y="593">deterministic node — no model call</text>
</g>
</svg>
