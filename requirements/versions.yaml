# The catalog governance registry (DEC-057): lifecycle status, maintainer, and dates, held
# outside the version directories and outside the content hash -- so retiring a version never
# alters content whose hash a recorded assessment verifies. The loader sources lifecycle status
# from here when an entry exists; each frozen manifest keeps whatever status it carried when it
# froze. The mapping-file and freeze-guard tests read this file too.

versions:

  "0.1":
    status: active
    maintainer: Ethan Turner
    # DEC-057 set the release condition: 0.1 releases when the recorded ForgeFlow fixture
    # (#263) lands. The fixture landed with the M9 demonstration work; the release is recorded
    # here at registry creation, and requirements/0.1/ is frozen from this date (the CI guard
    # in scripts/check_catalog_freeze.py enforces it at PR time).
    released: 2026-08-12
    last_reviewed: 2026-08-12

  "0.2":
    status: active
    maintainer: Ethan Turner
    # DEC-099's release condition, fired: a version releases when the first committed recorded
    # scenario pins it -- rag-support-bot (DEC-098) made 0.2's content load-bearing for a replay,
    # and content a replay depends on must freeze. Release does not move the default: the root
    # manifest still names 0.1, and switching the default is its own decision (DEC-099).
    released: 2026-08-17
    last_reviewed: 2026-08-17

  "0.3":
    status: draft
    maintainer: Ethan Turner
    # The delegated-authentication (OAuth/OIDC) pack (#537, DEC-111): everything in 0.2
    # carries forward unchanged, plus req-OIDC-001..004. Draft in the change that authors it,
    # because the freeze guard forbids touching a released version's directory in the same
    # change that releases it; DEC-099's release condition has already fired (the oidc-portal
    # recording pins 0.3), and the registry-only flip to active rides the next release cut.
