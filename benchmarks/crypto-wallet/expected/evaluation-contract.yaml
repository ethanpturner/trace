# Wallet and Exchange evaluation contract
#
# Grading policy for the crypto-wallet benchmark scenario. Layout is fixed by DEC-027 and
# specified in docs/architecture/evaluation-plan.md section 5.
#
# This file declares no expected-output counts (DEC-028): the expected set is the
# enumerated content of the expected-*.yaml files in this directory.
#
# Provenance: derived from the cryptocurrency-wallet threat model in the OWASP Threat
# Model Library (threat-models/web/cryptocurrency-wallet-threat-model.json, MIT license),
# itself ported from the Threat Modeling Cookbook. The input document restates the source
# model's system description as documentation supplied to Trace; the expected threats are
# derived from its threat list, which is never supplied to Trace.
#
# Nothing in this directory is supplied to Trace during an assessment.

benchmark_version: "1.0"

# The requirements catalog version these expected outputs were authored against (DEC-027).
catalog_version: "0.1"

matching:
  # Expected-to-actual matching is semantic, not numeric (DEC-028). Generated identifiers
  # are scoped to a run and carry no meaning across runs (DEC-018).
  findings_match_on: [requirement_id, affected_component]
  allow_consolidation: true
