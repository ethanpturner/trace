# Checkpoint-2 finding decisions for the managed-db-service live capture.
# Authored per capture (DEC-091); the reviewer of record for a capture is the capture protocol.
assessment_id: asm-001
findings:
  - id: fnd-001
    decision: reject
    rationale: >
      The claimed flow has two legs and neither supports a finding. The metrics-API-to-database
      leg is documented as encrypted: the platform's transport encryption terminates at the
      managed endpoint, so the requirement is satisfied by an inherited control there, and an
      interception finding on that leg asserts an absence the document contradicts — the
      common_false_positives entry req-DATA-001 names for managed services. The
      product-service-to-API and dashboard-to-API legs are silent on transport encryption:
      "internal HTTP service" names the interface, and no passage states those flows are
      unencrypted. Under DEC-009 that silence is a question or a gap, never a finding, and the
      open questions on network reachability (qst-007) and API-to-database credentials
      (qst-008) already hold the unresolved substance. The evidence cited establishes that the
      data is confidential and the requirement applies — applying is not failing.
documentation_gaps:
  # DEC-159 migration. Before it, a documentation gap was proposed and decided nowhere: the
  # object never left `candidate`, report section 9 filtered on `approved` and was structurally
  # empty, and the deliverable stated that the assessment recorded no gaps while the package
  # held them. Gaps are now checkpoint-2 subjects, which makes 264 of them across the recorded
  # scenarios subjects at once. Authoring 264 individual judgments as part of the change that
  # created the need for them would be inventing a review nobody performed, so each scenario
  # records one scenario-level decision that says so. A re-capture authors one entry per gap
  # under `gaps:` instead.
  default: approve
  rationale: >-
    DEC-159 migration, not a review: approved as generated. A candidate gap asserts only that
    something could not be determined from the documents supplied, which is what this run
    established; approving it adds no claim the run did not make. This is the opposite of a
    finding, where approval asserts a weakness exists, and it is why the migration default is
    an approval rather than a rejection.
