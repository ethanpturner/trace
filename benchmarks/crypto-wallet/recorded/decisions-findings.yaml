assessment_id: asm-001
findings:
- id: fnd-001
  decision: approve
  severity: medium
  rationale: 'Evidence-supported weakness, not silence: the documentation positively states the wallet
    file should be encrypted at rest and that encryption is only a wallet option [evd-004], so the control
    exists but is not enforced. Medium rather than high: exploitation requires prior access to the user
    device, and the checkpoint-1 answer records enforcement and default state as undetermined.'
- id: fnd-002
  decision: reject
  rationale: 'DEC-009: the finding is premised on TLS misconfiguration, but the documentation states an
    expected posture (TLS at the load balancer, HTTPS front-to-back) that has not been re-verified, and
    no evidence shows a misconfiguration. Unverified is not unmet; the verification gap is qst-001''s,
    which the run itself asked and the reviewer answered as undetermined.'
- id: fnd-003
  decision: reject
  rationale: 'The description establishes the requirement''s applicability (confidential data crosses
    a boundary), not a deficiency: the documented control on df-008 is API-key authentication over a TLS
    WebSocket, and no evidence shows a weakness in it. Key lifecycle and logging posture are the open
    questions (qst-009), not findings (DEC-009).'
documentation_gaps:
  # DEC-159 migration. Before it, a documentation gap was proposed and decided nowhere: the
  # object never left `candidate`, report section 9 filtered on `approved` and was structurally
  # empty, and the deliverable stated that the assessment recorded no gaps while the package
  # held them. Gaps are now checkpoint-2 subjects, which makes 264 of them across the recorded
  # scenarios subjects at once. Authoring 264 individual judgments as part of the change that
  # created the need for them would be inventing a review nobody performed, so each scenario
  # records one scenario-level decision that says so. A re-capture authors one entry per gap
  # under `gaps:` instead.
  default: approve
  rationale: >-
    DEC-159 migration, not a review: approved as generated. A candidate gap asserts only that
    something could not be determined from the documents supplied, which is what this run
    established; approving it adds no claim the run did not make. This is the opposite of a
    finding, where approval asserts a weakness exists, and it is why the migration default is
    an approval rather than a rejection.
