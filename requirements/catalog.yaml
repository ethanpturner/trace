catalog:
  # A name, not an identifier: authored configuration is outside the identifier scheme, and a
  # catalog is identified by (id, version). See DEC-034 and data-model.md section 2.1.
  id: core
  name: "Core Architecture Requirements"
  version: "0.1"
  description: >
    The initial requirements catalog. Architecture-level security expectations
    assessable from design documentation, written to be applied selectively
    rather than as a checklist.
  created_at: 2026-08-08
  status: draft

  # content_hash is defined as required on RequirementsCatalog in
  # docs/architecture/data-model.md section 30, and is deliberately absent here.
  # It is a derived value with no loader to compute or verify it against, and a
  # hand-maintained hash would be stale after the first edit. See
  # requirements/README.md.

  requirement_ids:

    - req-ADMIN-001

    - req-AI-001
    - req-AI-002
    - req-AI-003
    - req-AI-004

    - req-AUTH-001
    - req-AUTH-002

    - req-AUTHZ-001
    - req-AUTHZ-002

    - req-CICD-001

    - req-DATA-001
    - req-DATA-002
    - req-DATA-003
    - req-DATA-004

    - req-LOG-001
    - req-LOG-002

    - req-NET-001

    - req-SECRET-001
    - req-SECRET-002

    - req-TPI-001
    - req-TPI-002

    - req-WEBHOOK-001
    - req-WEBHOOK-002
