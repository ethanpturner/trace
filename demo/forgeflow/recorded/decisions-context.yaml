assessment_id: asm-001
system_context_version: 1
reviewer: recorded-reviewer
components:
- id: cmp-001
  decision: approve
  attach_evidence: []
  editable:
    name: Managed CDN and Web Application Firewall
    description: Public edge layer that terminates public TLS connections, serves static frontend content,
      routes application traffic, applies managed filtering rules, provides basic denial-of-service protection,
      and restricts access to known application origins. Managed separately from the ForgeFlow application
      runtime.
    component_type: cdn_waf
    technology:
    - managed CDN
    - managed web application firewall
    ownership: Managed cloud/edge provider, integrated by ForgeFlow
    deployment_zone: public_edge
    internet_accessible: true
    externally_managed: true
    data_classifications: []
    authentication_mechanisms: []
    authorization_mechanisms: []
- id: cmp-002
  decision: approve
  attach_evidence: []
  editable:
    name: React Web Application
    description: Customer-facing React single-page application that starts the GitHub authentication flow,
      displays connected organizations, repositories, analysis status and results, manages organization
      settings and automatic-comment configuration, and initiates permitted job retries. Communicates
      with the ForgeFlow API over HTTPS and does not store long-lived GitHub or provider credentials.
    component_type: web_application
    technology:
    - React
    - single-page application
    ownership: ForgeFlow
    deployment_zone: customer_browser
    internet_accessible: true
    externally_managed: false
    data_classifications:
    - confidential
    authentication_mechanisms:
    - github_oauth
    authorization_mechanisms: []
- id: cmp-003
  decision: approve
  attach_evidence: []
  editable:
    name: ForgeFlow API
    description: 'Python service providing customer-facing application functionality: authenticated session
      management, organization membership, repository configuration, analysis result retrieval, signed
      links for stored artifacts, automatic-comment settings, organization-level data-deletion support,
      selected GitHub API operations, and permitted administrative operations. Requests operating on customer
      resources include an organization context.'
    component_type: service
    technology:
    - Python
    ownership: ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: true
    externally_managed: false
    data_classifications:
    - restricted
    - confidential
    authentication_mechanisms:
    - github_oauth
    - session_cookie
    authorization_mechanisms:
    - organization_membership
    - user_role
- id: cmp-004
  decision: approve
  attach_evidence: []
  editable:
    name: Webhook Receiver
    description: 'Internet-facing service dedicated to processing GitHub webhook events: receives event
      payloads, validates incoming requests, parses event metadata, identifies the related installation
      and repository, determines relevance, creates an analysis job and sends it to the managed queue.
      Independently scalable from the main API; invalid or unsupported events are rejected or ignored.'
    component_type: service
    technology: []
    ownership: ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: true
    externally_managed: false
    data_classifications:
    - confidential
    authentication_mechanisms:
    - request_validation
    authorization_mechanisms: []
- id: cmp-005
  decision: approve
  attach_evidence: []
  editable:
    name: Managed Redis Queue
    description: Managed Redis service holding pending analysis jobs, job retry state, temporary coordination
      data, selected rate-limiting state and short-lived cached metadata. Documented as accessible only
      from approved application workloads and not the authoritative store for completed analysis results.
    component_type: managed_cache
    technology:
    - Redis
    - managed cloud service
    ownership: Managed cloud provider, used by ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: false
    externally_managed: true
    data_classifications:
    - confidential
    authentication_mechanisms:
    - unknown
    authorization_mechanisms:
    - network_restriction
- id: cmp-006
  decision: approve
  attach_evidence: []
  editable:
    name: Analysis Worker
    description: Background service that retrieves queued analysis jobs, resolves organization and GitHub
      installation, obtains short-lived installation tokens, retrieves pull-request diffs and selected
      repository content, constructs and sends analysis requests to the external AI provider, validates
      response structure, stores structured results and artifacts, triggers pull-request comments and
      records job status. Documented as the primary component handling customer source content; scales
      horizontally on queue depth.
    component_type: service
    technology: []
    ownership: ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: false
    externally_managed: false
    data_classifications:
    - restricted
    - confidential
    authentication_mechanisms:
    - workload_identity
    authorization_mechanisms:
    - installation_scope
- id: cmp-007
  decision: approve
  attach_evidence: []
  editable:
    name: GitHub Comment Service
    description: Publishes ForgeFlow summaries to GitHub pull requests. Receives organization, repository
      and pull-request identifiers, the structured analysis result and comment configuration; formats
      the summary, applies output-length restrictions, removes unsupported formatting, adds a link to
      the full result, uses a short-lived GitHub installation token and posts through the GitHub API.
      Does not perform AI analysis itself.
    component_type: service
    technology: []
    ownership: ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: false
    externally_managed: false
    data_classifications:
    - confidential
    authentication_mechanisms:
    - workload_identity
    authorization_mechanisms:
    - installation_scope
- id: cmp-008
  decision: approve
  attach_evidence: []
  editable:
    name: Administrative Interface
    description: Internal operational support interface allowing authorized ForgeFlow administrators to
      locate organizations and installations, view job status, review error metadata, retry failed jobs,
      disable an integration, review selected operational events and support data-deletion requests. Not
      exposed through the normal customer login flow; administrators authenticate through the corporate
      identity provider.
    component_type: internal_application
    technology: []
    ownership: ForgeFlow
    deployment_zone: internal_administration
    internet_accessible: null
    externally_managed: false
    data_classifications:
    - confidential
    authentication_mechanisms:
    - corporate_sso
    authorization_mechanisms:
    - administrative_permissions
- id: cmp-009
  decision: approve
  attach_evidence: []
  editable:
    name: Managed PostgreSQL
    description: Primary structured-data store containing users, organizations, memberships, roles, GitHub
      installation metadata, repository configuration, pull-request metadata, analysis job metadata, structured
      analysis results, comment-publication status, administrative audit events and data-deletion status.
      Customer-associated records include an organization identifier; application services apply organization-aware
      access rules. Backups and platform maintenance are managed by the cloud database service.
    component_type: managed_database
    technology:
    - PostgreSQL
    - managed cloud service
    ownership: Managed cloud provider, used by ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: false
    externally_managed: true
    data_classifications:
    - confidential
    authentication_mechanisms:
    - database_credentials
    authorization_mechanisms:
    - application_enforced_organization_scope
- id: cmp-010
  decision: approve
  attach_evidence: []
  editable:
    name: Managed Object Storage
    description: 'Managed object storage for larger or temporary artifacts: selected repository files,
      pull-request diffs, model input and output artifacts, exported reports and diagnostic artifacts
      for failed jobs. Objects are stored under paths including the ForgeFlow organization identifier
      and job identifier; the API may generate time-limited access links for permitted customer downloads.'
    component_type: managed_storage
    technology:
    - managed object storage
    ownership: Managed cloud provider, used by ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: null
    externally_managed: true
    data_classifications:
    - restricted
    - confidential
    authentication_mechanisms:
    - unknown
    authorization_mechanisms:
    - signed_link
- id: cmp-011
  decision: approve
  attach_evidence: []
  editable:
    name: Managed Secrets Service
    description: Managed secrets service holding the GitHub App private key, GitHub OAuth client secret,
      external AI-provider API key, email-provider API key and selected database connection credentials.
      Application workloads retrieve secrets through workload identity where supported; different services
      may receive access to different secrets based on responsibilities.
    component_type: managed_security_service
    technology:
    - managed secrets service
    ownership: Managed cloud provider, used by ForgeFlow
    deployment_zone: application_runtime
    internet_accessible: false
    externally_managed: true
    data_classifications:
    - restricted
    authentication_mechanisms:
    - workload_identity
    authorization_mechanisms:
    - per_service_secret_scope
- id: cmp-012
  decision: approve
  attach_evidence: []
  editable:
    name: Central Logging Platform
    description: Shared logging platform receiving application and security-relevant events including
      authentication events, API request metadata, organization-membership changes, GitHub installation
      changes, webhook-processing outcomes, analysis-job status, external-provider request metadata, comment-publication
      status, administrative actions and application errors.
    component_type: managed_logging
    technology:
    - centralized logging platform
    ownership: Shared organizational capability managed outside the application team
    deployment_zone: shared_platform
    internet_accessible: null
    externally_managed: true
    data_classifications:
    - internal
    authentication_mechanisms:
    - unknown
    authorization_mechanisms:
    - unknown
- id: cmp-013
  decision: approve
  attach_evidence: []
  editable:
    name: GitHub
    description: External source-code and identity provider. Supplies customer authentication (OAuth),
      GitHub App installation, repository permissions, pull-request metadata, source-content retrieval,
      webhook events and pull-request comments. The only supported source-code provider in the current
      release.
    component_type: external_service
    technology:
    - GitHub App
    - GitHub OAuth
    - GitHub API
    - GitHub webhooks
    ownership: Third party (GitHub)
    deployment_zone: external
    internet_accessible: true
    externally_managed: true
    data_classifications:
    - restricted
    - confidential
    authentication_mechanisms:
    - github_app
    - github_installation_token
    authorization_mechanisms:
    - installation_scope
- id: cmp-014
  decision: approve
  attach_evidence: []
  editable:
    name: External AI Provider
    description: Third-party enterprise AI provider that receives analysis instructions, pull-request
      metadata and changes, selected repository context and output-format requirements, and returns a
      structured analysis response. Documented as not receiving GitHub App private keys, installation
      tokens, ForgeFlow session cookies, database credentials or direct repository access.
    component_type: external_service
    technology:
    - enterprise AI API
    ownership: Third party AI provider
    deployment_zone: external
    internet_accessible: true
    externally_managed: true
    data_classifications:
    - restricted
    authentication_mechanisms:
    - api_key
    authorization_mechanisms:
    - unknown
- id: cmp-015
  decision: approve
  attach_evidence: []
  editable:
    name: Email Provider
    description: Third-party email service used for selected notifications. May receive user email address,
      organization display name, notification category, minimal notification content and a link to ForgeFlow;
      documented as not receiving customer repository source code.
    component_type: external_service
    technology: []
    ownership: Third party email provider
    deployment_zone: external
    internet_accessible: true
    externally_managed: true
    data_classifications:
    - confidential
    authentication_mechanisms:
    - api_key
    authorization_mechanisms:
    - unknown
- id: cmp-016
  decision: approve
  attach_evidence: []
  editable:
    name: Corporate Identity Provider
    description: Corporate identity platform used to authenticate ForgeFlow administrators and operations
      personnel before they access the administrative interface. Structured input states MFA is required
      for administrative identity.
    component_type: identity_provider
    technology: []
    ownership: Internal corporate IT / shared organizational capability
    deployment_zone: shared_platform
    internet_accessible: null
    externally_managed: true
    data_classifications:
    - internal
    authentication_mechanisms:
    - corporate_sso
    authorization_mechanisms:
    - unknown
actors:
- id: act-001
  decision: approve
  attach_evidence: []
  editable:
    name: Customer Developer / Engineering User
    actor_type: customer_user
    trust_level: authenticated customer user, scoped to organizations where they hold membership
    capabilities:
    - Sign in with GitHub
    - View connected repositories and analysis status
    - View completed analysis results
    - Retry selected failed analyses
    authentication_method: github_oauth
- id: act-002
  decision: approve
  attach_evidence: []
  editable:
    name: Customer Administrator / Repository Administrator
    actor_type: customer_administrator
    trust_level: authenticated customer user with organization administrative role
    capabilities:
    - Install or remove the GitHub App
    - Select connected repositories
    - Invite organization users
    - Enable or disable automatic pull-request comments
    - View usage information
    - Request deletion of organization data
    authentication_method: github_oauth
- id: act-003
  decision: approve
  attach_evidence: []
  editable:
    name: ForgeFlow Administrator / Operations Personnel
    actor_type: internal_operator
    trust_level: internal privileged personnel, authenticated through the corporate identity platform
    capabilities:
    - Locate organizations and installations
    - View analysis job status and error metadata
    - Retry failed jobs
    - Disable repository integrations
    - Review operational and queue status
    - Support data-deletion requests
    authentication_method: corporate_sso
- id: act-004
  decision: approve
  attach_evidence: []
  editable:
    name: GitHub Platform (service identity)
    actor_type: external_service_identity
    trust_level: external third-party platform; webhook events are validated before processing and are
      assumed to originate from GitHub infrastructure
    capabilities:
    - Send webhook events to the ForgeFlow webhook receiver
    - Issue short-lived installation tokens
    - Authenticate customer users via OAuth
    authentication_method: request_validation
- id: act-005
  decision: approve
  attach_evidence: []
  editable:
    name: External AI Provider (service identity)
    actor_type: external_service_identity
    trust_level: external third party that receives customer source content across a documented trust
      boundary; its responses are treated as requiring validation
    capabilities:
    - Receive selected pull-request and repository content
    - Return structured analysis responses
    authentication_method: api_key
- id: act-006
  decision: approve
  attach_evidence: []
  editable:
    name: Repository / Pull-Request Content Author
    actor_type: untrusted_content_source
    trust_level: untrusted; documentation states repository content may be untrusted and names a boundary
      separating trusted analysis instructions from repository and pull-request content
    capabilities:
    - Author pull-request titles, descriptions, diffs, source files, configuration and documentation that
      are retrieved and included in analysis requests
    authentication_method: unknown
assets:
- id: ast-001
  decision: approve
  attach_evidence: []
  editable:
    name: Customer Source Code and Repository Content
    asset_type: customer_data
    description: Pull-request diffs, changed source files, selected repository documentation and configuration
      files retrieved from GitHub and used to build analysis requests.
    confidentiality_impact: Documented as a primary protection objective; exposure would reveal customer
      proprietary source code, and this content crosses the AI-provider trust boundary.
    integrity_impact: Corrupted or substituted repository content would produce misleading analysis results
      presented to developers.
    availability_impact: Not directly stated; retrieval failures cause analysis jobs to fail or be retried.
    data_classification: restricted
    owner: Customer organization
- id: ast-002
  decision: approve
  attach_evidence: []
  editable:
    name: Structured Analysis Results
    asset_type: customer_data
    description: Structured AI-generated review output including summary, key observations, suggested
      review topics, potential security concerns and confidence indicators, stored and displayed to customers
      and optionally published to pull requests.
    confidentiality_impact: Results describe customer code changes and potential security concerns; exposure
      across organizations would breach tenant separation.
    integrity_impact: Altered results would mislead developer review decisions and could be published
      publicly to pull requests.
    availability_impact: Documented expectation that previously completed results remain viewable during
      AI-provider outages.
    data_classification: confidential
    owner: Customer organization
- id: ast-003
  decision: approve
  attach_evidence: []
  editable:
    name: Pull-Request, Repository and Installation Metadata
    asset_type: customer_data
    description: Repository identifier, installation identifier, organization identifier, repository name,
      pull-request identifier, branch names, event and delivery information and selected operational metadata.
    confidentiality_impact: Reveals customer repository and organization structure and development activity.
    integrity_impact: Incorrect metadata could route jobs or comments to the wrong repository, installation
      or organization.
    availability_impact: Required for job execution, auditing and customer reporting.
    data_classification: confidential
    owner: Customer organization
- id: ast-004
  decision: approve
  attach_evidence: []
  editable:
    name: User Identity, Organization Membership and Roles
    asset_type: customer_data
    description: GitHub-derived user identity associated with a ForgeFlow user, organization membership
      records and assigned customer roles, which are the basis for authorization decisions.
    confidentiality_impact: Contains user identity and email addresses used for notifications.
    integrity_impact: Modification of membership or role records would grant access to another organization's
      data.
    availability_impact: Required for customer login and authorization.
    data_classification: confidential
    owner: ForgeFlow / customer organization
- id: ast-005
  decision: approve
  attach_evidence: []
  editable:
    name: GitHub App Private Key
    asset_type: credential
    description: Private key used to authenticate as the GitHub App and obtain installation tokens; stored
      in the managed secrets service and explicitly not sent to the AI provider.
    confidentiality_impact: Compromise would permit generation of installation tokens for all customer
      installations.
    integrity_impact: Not stated.
    availability_impact: Loss would prevent repository access for all customers.
    data_classification: restricted
    owner: ForgeFlow
- id: ast-006
  decision: approve
  attach_evidence: []
  editable:
    name: Short-Lived GitHub Installation Tokens
    asset_type: credential
    description: Short-lived tokens issued by GitHub granting installation-scoped repository access to
      workers and the comment service; documented as not permanently stored and not transmitted to the
      AI provider.
    confidentiality_impact: Compromise would grant temporary access to the customer repositories in the
      installation scope.
    integrity_impact: Permits posting pull-request comments as the ForgeFlow app.
    availability_impact: Token issuance failures block repository retrieval.
    data_classification: restricted
    owner: ForgeFlow / GitHub
- id: ast-007
  decision: approve
  attach_evidence: []
  editable:
    name: AI Provider, OAuth, Email and Database Credentials
    asset_type: credential
    description: GitHub OAuth client secret, external AI-provider API key, email-provider API key and
      selected database connection credentials held in the managed secrets service.
    confidentiality_impact: Compromise would allow impersonation of ForgeFlow to external providers or
      direct database access.
    integrity_impact: Not stated.
    availability_impact: Loss would interrupt authentication, analysis and notification functions.
    data_classification: restricted
    owner: ForgeFlow
- id: ast-008
  decision: approve
  attach_evidence: []
  editable:
    name: Customer Browser Session
    asset_type: session_credential
    description: Secure browser session established after successful GitHub authentication and used for
      subsequent customer requests; the session cookie is named as primary data in the login flow and
      is explicitly not sent to the AI provider.
    confidentiality_impact: Session theft would give access to a customer's ForgeFlow organizations and
      results.
    integrity_impact: Not stated.
    availability_impact: Not stated.
    data_classification: restricted
    owner: ForgeFlow
- id: ast-009
  decision: approve
  attach_evidence: []
  editable:
    name: Analysis Artifacts in Object Storage
    asset_type: customer_data
    description: 'Temporary artifacts created during analysis: pull-request metadata, repository diffs,
      selected repository files, prompt construction artifacts, model input and output artifacts, exported
      reports and diagnostic information for failed jobs, stored under organization- and job-scoped paths.'
    confidentiality_impact: Artifacts include customer source material and constructed prompts; cross-organization
      exposure would breach tenant separation.
    integrity_impact: Artifacts may be reused during retry, so tampering could influence re-analysis results.
    availability_impact: Retry behaviour depends on artifacts remaining available.
    data_classification: restricted
    owner: Customer organization
- id: ast-010
  decision: approve
  attach_evidence: []
  editable:
    name: Audit Events and Operational Logs
    asset_type: operational_data
    description: Administrative audit events stored in PostgreSQL and security-relevant and operational
      events forwarded to the central logging platform, used for investigation and monitoring.
    confidentiality_impact: Logs are documented as intended to exclude customer source code and access
      tokens.
    integrity_impact: Required to support incident investigation and administrative accountability.
    availability_impact: Alerts depend on log and monitoring availability.
    data_classification: internal
    owner: ForgeFlow
- id: ast-011
  decision: approve
  attach_evidence: []
  editable:
    name: Analysis Processing Availability
    asset_type: operational_property
    description: The ability to process pull-request events asynchronously within expected time, scale
      workers on queue depth, and continue serving previously completed results during external provider
      outages.
    confidentiality_impact: Not applicable.
    integrity_impact: Duplicate processing may occur after infrastructure failures, potentially producing
      duplicate pull-request comments.
    availability_impact: External AI-provider capacity may limit total processing throughput; a temporary
      provider outage should not prevent viewing previously completed results.
    data_classification: internal
    owner: ForgeFlow Platform Operations
