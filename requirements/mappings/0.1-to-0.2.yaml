# The DEC-057 fate map: one fate per 0.1 requirement identifier, authored with 0.2. The loader
# never reads this file; its consumers are people and longitudinal tooling. Fates at a minor
# boundary are `unchanged`, `revised`, and `retired`; the major-boundary fates (`moved_to`,
# `merged_to`, `split_to`, `deleted`) do not apply here. Every entry's `catalog_version` field
# moved from "0.1" to "0.2" mechanically; that carriage is what `unchanged` means at a minor
# version, not byte identity.

