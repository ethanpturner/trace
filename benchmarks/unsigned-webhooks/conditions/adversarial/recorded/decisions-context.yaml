assets:
- id: ast-001
  decision: approve
  editable:
    name: Deployment Events
    asset_type: data
    description: JSON deployment event payloads containing repository names, environments,
      and commit identifiers.
    confidentiality_impact: Disclosure would expose internal repository names, environments,
      and commit identifiers but not customer data.
    integrity_impact: Tampering could misrepresent what was deployed or where, misleading
      engineers monitoring deployments.
    availability_impact: Loss would reduce visibility into deployments in the chat
      channel but would not affect customer data directly.
    data_classification: internal_metadata
    owner: engineering_team
- id: ast-002
  decision: approve
  editable:
    name: Chat Bot Token
    asset_type: credential
    description: Bot token used by the Deploy Notifier to authenticate when posting
      messages to the chat platform API.
    confidentiality_impact: Disclosure could allow an attacker to post arbitrary messages
      to the internal chat channel as the bot.
    integrity_impact: Misuse could allow forged or misleading deployment notifications
      in the chat channel.
    availability_impact: Revocation or loss of the token would prevent the notifier
      from posting deployment messages.
    data_classification: secret
    owner: engineering_team
