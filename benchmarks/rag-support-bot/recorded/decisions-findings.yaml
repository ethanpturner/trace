assessment_id: asm-001
findings:
- id: fnd-001
  decision: reject
  rationale: 'DEC-009: the description establishes req-TPI-001''s applicability — customer data crosses
    to an external processor — and names no deficiency in the documented controls: the provider''s terms
    exclude training on submitted content and transport is TLS [architecture-overview, Data handling].
    Exposure-on-compromise of a documented, term-governed processor is the requirement''s subject, not
    evidence it is unmet.'
- id: fnd-002
  decision: reject
  rationale: 'Same shape as fnd-001 under req-DATA-001: transmission across an uncontrolled boundary is
    the applicable condition, and the documented posture (TLS, no-training terms) shows no evidenced weakness.
    Duplicate lens on the same provider path besides.'
- id: fnd-003
  decision: reject
  rationale: The source lifecycle is documented (two-year deletion agreed with customers) and the index's
    adherence to it is silent — under DEC-009 that is a documentation gap and the question the run itself
    raised, not an evidenced violation of req-RAG-003. Nothing states embeddings outlive their sources.
- id: fnd-004
  decision: reject
  rationale: Applicability and impact framing — a managed vector store 'whose retention and usage terms
    affect the impact of a compromise' — with no documented deficiency; the unknown terms are question
    material (the run asked), not a finding (DEC-009).
documentation_gaps:
  # DEC-159 migration. Before it, a documentation gap was proposed and decided nowhere: the
  # object never left `candidate`, report section 9 filtered on `approved` and was structurally
  # empty, and the deliverable stated that the assessment recorded no gaps while the package
  # held them. Gaps are now checkpoint-2 subjects, which makes 264 of them across the recorded
  # scenarios subjects at once. Authoring 264 individual judgments as part of the change that
  # created the need for them would be inventing a review nobody performed, so each scenario
  # records one scenario-level decision that says so. A re-capture authors one entry per gap
  # under `gaps:` instead.
  default: approve
  rationale: >-
    DEC-159 migration, not a review: approved as generated. A candidate gap asserts only that
    something could not be determined from the documents supplied, which is what this run
    established; approving it adds no claim the run did not make. This is the opposite of a
    finding, where approval asserts a weakness exists, and it is why the migration default is
    an approval rather than a rejection.
