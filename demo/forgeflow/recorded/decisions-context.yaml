contradictions:
- id: obs-002
  summary: Source-artifact retention is described inconsistently. The product overview states source files
    are treated as temporary processing data and are deleted after analysis completes, and the AI analysis
    document states repository content is transmitted only for the duration of the analysis request. The
    operations guide states artifacts (including selected repository files and repository diffs) remain
    available for troubleshooting with a current retention target of 30 days, subject to extension, and
    that retries may reuse previously stored artifacts. The architecture overview lists source-artifact
    retention as an open documentation gap. Which statement is authoritative changes what customer source
    material the platform holds and for how long.
  claims:
  - ctx-037
  evidence:
  - evd-099
  - evd-013
  - evd-079
  - evd-077
  - evd-054
  resolution: null
  rationale: null
- id: obs-003
  summary: Whether AI-generated output receives human review before it becomes externally visible is stated
    inconsistently. The security overview asserts that externally visible AI-generated output is reviewed
    before publication. The AI analysis and operations documents describe automatic pull-request comment
    publication as an automated sequence following successful schema validation, with no human review
    step, and the structured system input records human_review_required as unknown while automatic_pull_request_comments
    is true.
  claims:
  - ctx-032
  evidence:
  - evd-133
  - evd-010
  - evd-082
  - evd-151
  resolution: null
  rationale: null
