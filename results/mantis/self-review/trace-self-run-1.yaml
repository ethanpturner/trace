- raw_signature: 554663ce481927b9
  title: Budget accounting omits separators between included evidence blocks
  tool_status: PROVISIONALLY_VALID
  tool_severity: MEDIUM
  cwe: CWE-20
  evidence_locator: src/trace_ai/services/budget.py:84-86,124-130
  classification: c
  reasoning: 'verified: used += len(block) while untrusted joins with two newlines; the emitted region can exceed
