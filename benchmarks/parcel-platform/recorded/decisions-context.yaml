assets:
- id: ast-001
  decision: approve
  attach_evidence: []
  editable:
    name: Orders and customer records
    asset_type: data_record
    description: Shipment bookings, customer accounts, and delivery addresses associated with orders.
    confidentiality_impact: Exposure would reveal customer identities, accounts, and delivery addresses.
    integrity_impact: Corruption could affect pricing, shipment lifecycle, and customer account correctness.
    availability_impact: Loss of availability would prevent booking and managing shipments.
    data_classification: null
    owner: null
- id: ast-002
  decision: approve
  attach_evidence: []
  editable:
    name: Parcel tracking data
    asset_type: data_record
    description: Per-parcel scan history and tracking state.
    confidentiality_impact: Exposure would reveal parcel movement history and possibly delivery patterns.
    integrity_impact: Incorrect data could misrepresent parcel status and location.
    availability_impact: Loss would impact customers' and staff's ability to track shipments.
    data_classification: null
    owner: null
- id: ast-003
  decision: approve
  attach_evidence: []
  editable:
    name: Shipping label PDFs
    asset_type: file
    description: Rendered shipping labels in PDF format stored per shipment.
    confidentiality_impact: Labels may contain customer and shipment details that should not be exposed
      broadly.
    integrity_impact: Altered labels could misroute parcels.
    availability_impact: Unavailable labels could block shipment processing.
    data_classification: null
    owner: null
- id: ast-004
  decision: approve
  attach_evidence: []
  editable:
    name: Proof-of-delivery photos
    asset_type: file
    description: Photos captured during delivery as proof-of-delivery and stored in object storage.
    confidentiality_impact: Photos may include recipients and premises, creating privacy concerns if exposed.
    integrity_impact: Tampering could falsify proof of delivery.
    availability_impact: Loss could hinder dispute resolution about deliveries.
    data_classification: null
    owner: null
- id: ast-005
  decision: approve
  attach_evidence: []
  editable:
    name: Notification message logs
    asset_type: log_data
    description: Shared application log entries containing full rendered notification message bodies,
      including recipient name, delivery address, and delivery window.
    confidentiality_impact: Logs contain personal and delivery information; exposure would leak customer
      data.
    integrity_impact: Tampering could obscure or falsify notification history.
    availability_impact: Loss could affect troubleshooting and audit trails.
    data_classification: null
    owner: null
- id: ast-006
  decision: approve
  attach_evidence: []
  editable:
    name: Data warehouse copies of orders
    asset_type: data_record
    description: Nightly copies of the Orders Database, including customer names and full delivery addresses,
      stored in the Data Warehouse.
    confidentiality_impact: Exposure would reveal large-scale customer and address data over the retention
      period.
    integrity_impact: Corruption would affect analytics accuracy.
    availability_impact: Loss would impact reporting and analytics but not core transaction processing.
    data_classification: null
    owner: null
- id: ast-007
  decision: approve
  attach_evidence: []
  editable:
    name: Payment provider references
    asset_type: data_record
    description: References returned by the external payment provider and stored by the platform instead
      of full card data.
    confidentiality_impact: Exposure could link payments to customers and orders, but not reveal full
      card data.
    integrity_impact: Tampering could misassociate payments or hinder reconciliation.
    availability_impact: Loss would impact billing records and financial reconciliation.
    data_classification: null
    owner: null
- id: ast-008
  decision: approve
  attach_evidence: []
  editable:
    name: Message bus service credentials
    asset_type: credential
    description: Per-service credentials used by services to authenticate to the Message Bus, issued at
      deploy time.
    confidentiality_impact: Exposure could allow unauthorized publication or consumption of events.
    integrity_impact: Misuse could inject or alter events on the bus.
    availability_impact: Revocation or loss could disrupt service communication.
    data_classification: null
    owner: null
