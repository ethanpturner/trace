questions:
- id: qst-001
  question: Will the payment provider's callback-signing feature be enabled for Order Notifier, and will
    the Callback Receiver validate signatures and reject unsigned or invalid callbacks?
  priority: high
  blocking: false
  answer: Not currently. Both documents state the provider's optional callback-signing feature is not
    enabled; the operations notes record enabling it as backlog work, not yet scheduled. No signature-validation
    behavior exists to describe.
- id: qst-003
  question: What authentication mechanism, if any, is used when the Channel Poster calls the channel platform's
    HTTPS API (for example, API tokens or OAuth)?
  priority: high
  blocking: false
  answer: null
- id: qst-002
  question: How does Order Notifier handle repeated deliveries of the same callback (for example, retries
    from the payment provider)?
  priority: medium
  blocking: false
  answer: null
- id: qst-004
  question: No actor in the context is anonymous or external. If the system is reachable from outside,
    who reaches it? If it is not, what establishes that?
  priority: medium
  blocking: false
  answer: 'The operations notes state the callback endpoint accepts unsigned requests from anywhere: any
    internet caller that formats a callback correctly reaches intake and is processed as though it were
    the payment provider. External reachability is documented; the callers are effectively anonymous.'
- id: qst-005
  question: No actor in the context is administrative or privileged. Who operates and configures the system,
    and through what?
  priority: medium
  blocking: false
  answer: null
