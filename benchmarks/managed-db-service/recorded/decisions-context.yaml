questions:
- id: qst-001
  answer: >-
    Not documented. Nothing in the supplied material describes an authentication or
    authorization mechanism for the Metrics API, for writes or for queries. The subnet
    restriction is the only stated access control. Treat the mechanism as undetermined,
    not absent; this stands as analysis input.
- id: qst-002
  answer: >-
    Partially documented. At-rest storage is the managed metrics database, which the
    platform encrypts by default with keys in the platform KMS. The retention period and
    any lifecycle expiry for metrics records are not described anywhere in the supplied
    material and stand undetermined.
- id: qst-003
  answer: >-
    The system is not reachable from outside: the overview states the metrics store is
    reachable only from inside the application subnet and the Metrics API is not
    reachable from the internet, and terraform-db.tf.json sets publicly_accessible to
    false on the database. The only documented actors are the internal product service
    and the internal dashboard.
- id: qst-004
  answer: >-
    Not documented. The supplied material names no administrative or operating actor and
    no configuration path. Undetermined; no assumption is recorded either way.
