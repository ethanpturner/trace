    DEC-070 relies on this accounting. Issue #676.'
- raw_signature: 5fc07cf751a99174
  title: Predictable temporary files enable symlink-following overwrite and concurrent corruption
  tool_status: PROVISIONALLY_VALID
  tool_severity: HIGH
  cwe: CWE-367
  evidence_locator: src/trace_ai/infrastructure/filesystem/atomic.py:27; src/trace_ai/infrastructure/filesystem/artifact_store.py:151
  classification: b
  reasoning: 'threat-model.md §6 "Another local user reads assessment data" and §8 "The machine itself": another
    local process writing into the assessment directory is outside DEC-004''s single-user model; the same-process
    collision needs two concurrent writers to one path, and the pipeline is sequential. The O_EXCL hygiene is cheap
    and noted, not filed.'
