  name: "Core Architecture Requirements"
  version: "0.4"
  description: >
    The fourth catalog minor version (DEC-057; the webhook pack, #596).
    Everything in 0.3 carries forward under its identifier; the
    webhook-validation category grows from origin verification and replay
