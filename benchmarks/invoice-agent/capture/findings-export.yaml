assessment_id: asm-001
findings:
- id: fnd-001
  title: Interception or compromise of invoice details between agent and hosted model provider (req-AI-003)
  description: Invoice content supplied by users is parsed and the resulting invoice details (amount,
    submitter, category, due date) are sent from the Invoice Agent (cmp-001) to an external hosted model
    provider (cmp-003) for analysis [evd-001, evd-004, evd-005], so customer content crosses a model-provider
    boundary and the requirement to document what is sent and why that scope is necessary applies; the
    documentation describes that only parsed invoice details are returned to the model but does not explain
    why that scope is necessary, so the requirement is only partially satisfied.
  requirement_ids:
  - req-AI-003
  affected_component_ids:
  - cmp-001
  - cmp-003
  confidence: medium
  evidence_ids:
  - evd-001
  - evd-004
  - evd-005
questions:
- id: qst-001
  question: Are submitted invoice files stored persistently after processing, and if so, in which system(s)
    and for how long?
  status: answered
- id: qst-002
  question: Is there any authentication or access control in front of the invoice submission workflow
    beyond the submitter field inside the uploaded document?
  status: answered
- id: qst-003
  question: What observability service is used to capture request and tool-call traces, and what are its
    data retention and access control policies for HTTP request and response bodies?
  status: answered
- id: qst-004
  question: In what environment and deployment model does the Invoice Agent run (for example, production
    vs. test, and which cloud or on-premises platform)?
  status: open
- id: qst-005
  question: No actor in the context is administrative or privileged. Who operates and configures the system,
    and through what?
  status: open
- id: qst-006
  question: Can you confirm formal definition and scope of req-AI-002, including the conditions under
    which it is applicable; threat description for thr-001, including how the agent's decisions are consumed
    downstream and whether any human review step exists; design or risk-analysis documentation explicitly
    mapping req-AI-002 to this workflow and explaining why it is applicable?
  status: open
