[project]
name = "trace"
version = "0.1.0"
description = "Context-aware AI-assisted security architecture analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ethan Turner", email = "ethanpturner@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "langsmith>=0.10.16",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
trace = "trace_ai:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# The import package is `trace_ai` because `trace` shadows a stdlib module,
# while the distribution and CLI command stay named `trace`.
[tool.uv.build-backend]
module-name = "trace_ai"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    # Only the requirements-catalog test reads YAML. PyYAML is already present
    # transitively; it is declared here so the test does not depend on another
    # package's dependency, and types-pyyaml because PyYAML ships no stubs and
    # mypy runs strict over tests.
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of a test
    "S105",  # hardcoded fake credentials in fixtures
    "S106",
    "TC",    # pytest is needed at runtime for markers/fixtures, not just types
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so a type only imported under TYPE_CHECKING leaves the
# model undefined -- `Assessment` with `datetime` behind the guard raises PydanticUserError on the
# first validate. Naming the base classes here stops TC00x moving those imports.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "trace_ai.domain.base.DomainModel",
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m", "not integration and not evaluation",
]
markers = [
    "integration: hits a live model provider or external service (costs money)",
    "evaluation: runs the eval suite against real models (slow, costs money)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
