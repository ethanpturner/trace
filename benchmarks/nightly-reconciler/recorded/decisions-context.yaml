- id: qst-003
  answer: >
    The overview states the credential is provisioned through the standard workload
    deployment. Under the asserted secrets-vault control (org-controls catalog 0.2, approved
    as ctx-001), credentials provisioned that way are held in the enterprise secrets service,
    injected at deploy time, and rotated on a ninety-day schedule; they are not held in source
    control, container images, or configuration files.
- id: qst-004
  answer: null
- id: qst-005
  answer: >
    The reconciler exposes no inbound interface and initiates outbound HTTPS to the payment
    processor's reporting API; no external actor reaches the system. The billing database is
    stated to be reachable only from the reconciler job inside the application subnet; what
    enforces that restriction is not described by the documents.
