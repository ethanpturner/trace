- id: fnd-002
  title: Cross-workspace ticket corruption via unscoped source identifiers in the retrieval index (req-AUTHZ-001)
  validation_status: partially_supported
  severity: high
  decision: approve
  rationale: 'Approved on the documents, not on the packet. The architecture overview states affirmatively that
    all workspaces are served from one shared index and that relevance alone selects the passages that reach the
    prompt (evd-002), while the OpenAPI document establishes that the workspace token identifies the caller''s workspace
    (evd-019, evd-020, evd-025, evd-027, evd-028). A documented absence of any filter between a multi-tenant corpus
    and a per-tenant caller is an evidenced weakness under req-AUTHZ-001, which is the distinction DEC-009 draws
    between a finding and a gap. Severity high: the exposed asset is customer ticket content that the same documents
    record as sometimes carrying pasted configuration snippets.'
  override_rationale: null
  reviewer_rationale: null
  treatment: mitigate
  treatment_rationale: null
  treatment_review_by: null
  editable:
    title: Cross-workspace ticket corruption via unscoped source identifiers in the retrieval index (req-AUTHZ-001)
    description: Relay Answers serves more than one customer workspace through the in-product help panel (evd-001,
      evd-002, evd-017, evd-025), and support-ticket data for those workspaces is held together in a single shared
      retrieval index (evd-002, evd-023, ast-003), so data belonging to distinct organizations is stored in shared
      infrastructure. This matches req-AUTHZ-001's conditions for tenant-aware authorization in a multi-tenant system.
    recommendation: Establish whether req-AUTHZ-001 is met for thr-002, and record the control that meets it.
  convert_to_question:
    question: null
    rationale: null
    priority: medium
    blocking: false
  convert_to_documentation_gap:
    importance: null
    severity: null
    requested_evidence: []
- id: fnd-003
  title: Exposure of support ticket content through compromise or misuse of the external model provider (req-AI-003)
  validation_status: partially_supported
  severity: unassigned
  decision: reject
  rationale: 'DEC-009. Applicability and impact framing under req-AI-003 with no documented deficiency: the documents
    state what is sent, that the provider''s terms exclude training on submitted content, and that transport is
    TLS (evd-003, evd-004). Exposure on compromise of a documented, term-governed processor is the requirement''s
    subject, not evidence it is unmet. This matches the decision the scenario''s own recorded review made on the
    same shape.'
  override_rationale: null
  reviewer_rationale: null
  treatment: undecided
  treatment_rationale: null
  treatment_review_by: null
  editable:
    title: Exposure of support ticket content through compromise or misuse of the external model provider (req-AI-003)
    description: Relay Answers sends customer support ticket content from the support platform, along with help-center
      documentation, to an external hosted model provider as part of each answer, so customer content is sent to
      an external model provider and the content includes non-public support data. Documentation describes what
      is sent (user question plus retrieved passages), that workspace and user identifiers are stripped, and that
      ticket email addresses are masked before export, but it does not explicitly justify why sending full ticket
      text and configuration snippets is necessary for the analysis.
    recommendation: Establish whether req-AI-003 is met for thr-005, and record the control that meets it.
  convert_to_question:
    question: null
    rationale: null
    priority: medium
    blocking: false
  convert_to_documentation_gap:
