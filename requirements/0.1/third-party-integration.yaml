# Category: third_party_integration
# Requirements about parties outside the system's trust boundary that receive
# its data or that it depends on to operate.

requirements:

  - id: req-TPI-001
    catalog_version: "0.1"
    title: External processor data handling is documented
    statement: >
      Where customer data is sent to an external provider, the documentation
      must state what is sent, whether the provider retains it, for how long,
      and whether it is used for any purpose beyond serving the request.
    rationale: >
      Sending data to an external provider transfers it across a trust boundary
      the reviewing organization does not control, and the provider's retention
      and usage terms become part of the system's effective data handling.
      Documentation commonly answers the training question and leaves retention
      unstated, which is the narrower and less useful half of the answer.
    category:
      - third_party_integration
      - data_protection
    applicable_conditions:
      - customer data is sent to an external provider
      - an external provider processes data on the system's behalf
    non_applicable_conditions:
      - no customer data leaves the system's trust boundary
      - the external call carries only non-sensitive metadata
    acceptable_implementations:
      - documentation summarizing the provider's retention and usage terms
      - a contractual data processing agreement referenced from the architecture
      - a provider configuration that disables retention, recorded in documentation
    evidence_expectations:
      - documentation describing the external provider relationship
      - a statement of provider retention and usage terms
      - a description of what data crosses the boundary
    common_false_positives:
      - absent copy of the provider contract where terms are summarized
      - absent provider security certification detail
    default_severity: medium
    source_frameworks:
      - "OWASP ASVS: v5.0.0-13.1.1"
      - "NIST SP 800-53 5.2.0: SA-9"
    status: active

  - id: req-TPI-002
    catalog_version: "0.1"
    title: Work triggered by external events is bounded
    statement: >
      Processing that consumes a metered external service or significant
      compute must be bounded, so that a repeated or malicious trigger cannot
      drive unbounded consumption, and the bound must be documented.
    rationale: >
      Where each unit of work carries a direct external cost, an attacker who
      can trigger work repeatedly can impose cost or exhaust capacity without
      ever breaching a confidentiality or integrity control. Retry logic
      compounds this, because a failing operation may consume more than a
      succeeding one.
    category:
      - third_party_integration
      - availability
    applicable_conditions:
      - processing consumes a metered external service
      - work is triggered by an event the system does not originate
      - failed work is retried automatically
    non_applicable_conditions:
      - processing consumes no metered or capacity-limited resource
      - work is initiated only by an authenticated operator
    acceptable_implementations:
      - a bounded retry count with backoff
      - per-tenant rate or volume limits on triggered work
      - a spending or quota ceiling enforced at the provider
      - a queue depth limit that sheds load
    evidence_expectations:
      - operations documentation describing retry and rate limits
      - queue or worker configuration
      - description of provider quota controls
    common_false_positives:
      - absent cost ceiling where per-tenant rate limits are documented
      - absent autoscaling detail, which addresses capacity rather than bounding
    default_severity: medium
    source_frameworks:
      - "OWASP ASVS: v5.0.0-15.1.3"
      - "NIST SP 800-53 5.2.0: SC-5"
      - "OWASP Top 10 for LLM Applications 2025: LLM10"
    status: active
