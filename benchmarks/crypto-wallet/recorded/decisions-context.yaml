questions:
- id: qst-001
  question: Is TLS currently configured as described, with client connections terminating at the load
    balancer and all front-end to backend communication using HTTPS (including the exchange API)?
  priority: high
  blocking: true
  answer: 'The documentation states TLS is expected to terminate at the load balancer with all front-end
    to backend communication over HTTPS, and explicitly notes this has not been re-verified for the current
    deployment. No re-verification record is available to this review: the expectation stands as documented
    and unverified, and the verification gap is analysis input, not a resolved fact.'
- id: qst-002
  question: Is encryption at rest for the local wallet file enforced or optional per user, and is it enabled
    by default?
  priority: high
  blocking: true
  answer: 'The documentation states the wallet file should be encrypted at rest and that encryption is
    a wallet option. It does not state that encryption is enforced or enabled by default, and no further
    material is available to this review: whether it is enforced or default-on is undetermined. Treat
    enforcement as undetermined rather than absent or present.'
- id: qst-003
  question: What authentication and session management mechanisms protect user access to the exchange
    website and mobile app (e.g., password-based login, multi-factor authentication, session lifetime
    and renewal)?
  priority: medium
  blocking: false
  answer: null
- id: qst-004
  question: Which ElectrumX servers are used by the wallet daemon in production, and are there any controls
    (e.g., pinning, TLS, or whitelisting) to manage trust in these third-party servers?
  priority: medium
  blocking: false
  answer: null
- id: qst-005
  question: No actor in the context is anonymous or external. If the system is reachable from outside,
    who reaches it? If it is not, what establishes that?
  priority: medium
  blocking: false
  answer: null
- id: qst-006
  question: No actor in the context is administrative or privileged. Who operates and configures the system,
    and through what?
  priority: medium
  blocking: false
  answer: null
