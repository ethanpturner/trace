contradictions:
- id: obs-001
  summary: architecture-overview.md states that export files are deleted immediately once the customer
    has downloaded them, while operations-guide.md states that completed export files are retained in
    the managed object store for 30 days via a storage lifecycle policy.
  claims:
  - ctx-010
  - ctx-011
  - ctx-012
  evidence:
  - evd-003
  - evd-006
  resolution: Export objects are retained for 30 days in the managed object store under the storage lifecycle
    policy, then expired. The architecture overview's statement that the export file is deleted immediately
    once downloaded does not describe the configured behaviour.
  rationale: 'A configured storage lifecycle policy is a statement of what the system does; the architecture
    overview''s immediate-deletion sentence is a statement of intent about temporary working data. Where
    the two disagree, the configuration governs: the operations guide names the policy, its 30-day window,
    and the operator retrieval practice that depends on it. Resolved to 30-day retention; the intent claim
    remains recorded as the contradicted side.'
additions: []
questions:
- id: qst-001
  question: What is the authoritative retention and deletion policy for completed export files in the
    managed object store (for example, immediate deletion after customer download, 30-day lifecycle retention,
    or another policy)?
  priority: high
  blocking: true
  answer: 'The operations guide''s storage lifecycle policy is the authoritative statement: completed
    export objects are retained for 30 days and expired after that, and operators rely on that window
    to retrieve exports for failed downloads. The architecture overview''s immediate-deletion description
    is contradicted by that policy and no material shows a deletion-on-download mechanism. Effective retention
    is 30 days.'
- id: qst-003
  question: What authentication and authorization mechanisms protect the public Export API for requesting
    and downloading exports, and how is access constrained to each customer’s own exports?
  priority: high
  blocking: true
  answer: 'Not documented beyond the actor description: the customer is named as the authenticated requester
    and downloader, so authentication exists, but neither document states the mechanism, session handling,
    or how access is constrained to each customer''s own exports. Undetermined, and analysis input rather
    than a resolved fact.'
- id: qst-002
  question: What security controls (such as encryption at rest and access control configuration) are applied
    to export files stored in the managed object store?
  priority: medium
  blocking: false
  answer: null
- id: qst-004
  question: No actor in the context is anonymous or external. If the system is reachable from outside,
    who reaches it? If it is not, what establishes that?
  priority: medium
  blocking: false
  answer: null
- id: qst-005
