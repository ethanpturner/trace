- id: qst-005
  question: Is traffic to and from the Message Bus encrypted in transit (for example using TLS), and if
    so, how is this configured?
  priority: medium
  blocking: false
  answer: null
- id: qst-006
  question: No actor in the context is anonymous or external. If the system is reachable from outside,
    who reaches it? If it is not, what establishes that?
  priority: medium
  blocking: false
  answer: The platform is reachable from the internet through the API Gateway, the single public entry
    point. Customers and drivers reach it from outside; the gateway authenticates every request against
    the Identity Service, so an anonymous client reaches only the gateway's public surface. Carrier partners
    and the external providers interact over their own HTTPS APIs.
